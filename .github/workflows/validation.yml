name: validation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      risk:
        description: Minimum risk gate
        type: choice
        options: [R0, R1, R2, R3]
        default: R3

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHOTSTOPPER_VERBOSITY: compact
  SHOTSTOPPER_NONINTERACTIVE: "1"

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      risk: ${{ steps.risk.outputs.risk }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: risk
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REQUESTED_RISK: ${{ inputs.risk }}
        run: |
          mkdir -p ci-results/classify
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            risk=${REQUESTED_RISK:-R3}
            printf 'risk=%s\nsource=workflow input/default\n' "$risk" | tee ci-results/classify/classify.log
          else
            mapfile -t paths < <(git diff --name-only "$BASE_SHA" HEAD)
            output=$(./scripts/dev classify "${paths[@]}" 2>&1 | tee ci-results/classify/classify.log)
            risk=$(sed -n 's/^risk=//p' <<<"$output" | tail -1)
          fi
          [[ "$risk" =~ ^R[0-3]$ ]]
          echo "risk=$risk" >> "$GITHUB_OUTPUT"
      - name: Upload classification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-classify
          path: |
            ci-results/classify/
            artifacts/runs/
          if-no-files-found: error
          retention-days: 7

  fast:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fast validation
        shell: bash
        run: |
          mkdir -p ci-results/fast
          set -o pipefail
          ./scripts/dev validate --risk R0 README.md docs/README.md 2>&1 | tee ci-results/fast/fast.log
      - name: Upload fast validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-fast
          path: |
            ci-results/fast/
            artifacts/runs/
          if-no-files-found: error
          retention-days: 7

  host:
    needs: classify
    if: needs.classify.outputs.risk != 'R0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: mkdir -p ci-results/host
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcjson-dev
      - run: npm ci --no-audit --no-fund
      - run: set -o pipefail; ./scripts/dev test normal 2>&1 | tee ci-results/host/normal.log
        shell: bash
      - run: set -o pipefail; ./scripts/dev test asan 2>&1 | tee ci-results/host/asan.log
        shell: bash
      - run: set -o pipefail; ./scripts/dev test tsan 2>&1 | tee ci-results/host/tsan.log
        shell: bash
      - run: set -o pipefail; ./scripts/dev test tooling 2>&1 | tee ci-results/host/tooling.log
        shell: bash
      - run: set -o pipefail; ./scripts/dev test web 2>&1 | tee ci-results/host/web.log
        shell: bash
      - name: Upload host test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-host
          path: |
            ci-results/host/
            artifacts/runs/
          if-no-files-found: error
          retention-days: 7

  idf:
    needs: classify
    if: github.event_name != 'pull_request' || contains(fromJSON('["R2","R3"]'), needs.classify.outputs.risk)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        arch: [n8r4, n16r8]
        machine:
          - {name: paddle-latch, type: 0}
          - {name: momentary, type: 1}
          - {name: momentary-reed, type: 2}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: mkdir -p ci-results/idf
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs npm cppcheck && rm -rf /var/lib/apt/lists/*
      - run: npm ci --no-audit --no-fund
      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          ./scripts/dev build --arch ${{ matrix.arch }} \
            --webui-language en \
            --flags "-DSHOT_STOPPER_MACHINE_TYPE=${{ matrix.machine.type }} -DSHOT_STOPPER_ENABLE_JTAG=0 -DSHOT_STOPPER_ENABLE_REMOTE_MACHINE_CONTROL=0" \
            2>&1 | tee ci-results/idf/build.log
      - name: Name OTA image
        run: >-
          cp build-idf/${{ matrix.arch }}/shotstopper.bin
          build-idf/${{ matrix.arch }}/shotstopper-ota-${{ matrix.arch }}-${{ matrix.machine.name }}-jtag-off-remote-off.bin
      - name: Cppcheck
        if: needs.classify.outputs.risk == 'R3'
        shell: bash
        run: set -o pipefail; ./scripts/dev analyze --arch ${{ matrix.arch }} 2>&1 | tee ci-results/idf/cppcheck.log
      - name: Full scheduled clang-tidy analysis
        if: needs.classify.outputs.risk == 'R3' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: set -o pipefail; ./scripts/static-tidy-idf --arch ${{ matrix.arch }} 2>&1 | tee ci-results/idf/clang-tidy.log
      - name: Full scheduled IWYU analysis
        if: needs.classify.outputs.risk == 'R3' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: set -o pipefail; ./scripts/iwyu-idf --arch ${{ matrix.arch }} 2>&1 | tee ci-results/idf/iwyu.log
      - name: Extra GCC warnings
        if: needs.classify.outputs.risk == 'R3'
        shell: bash
        run: set -o pipefail; ./scripts/warnings-idf --arch ${{ matrix.arch }} 2>&1 | tee ci-results/idf/warnings.log
      - name: Full scheduled GCC analysis
        if: needs.classify.outputs.risk == 'R3' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: set -o pipefail; ./scripts/gcc_analyzer --arch ${{ matrix.arch }} --flags= 2>&1 | tee ci-results/idf/gcc-analyzer.log
      - name: Upload firmware and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shotstopper-ota-${{ matrix.arch }}-${{ matrix.machine.name }}-jtag-off-remote-off
          path: |
            build-idf/${{ matrix.arch }}/shotstopper-ota-${{ matrix.arch }}-${{ matrix.machine.name }}-jtag-off-remote-off.bin
            ci-results/idf/
            reports/
            artifacts/runs/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

  gate:
    needs: [classify, fast, host, idf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RISK: ${{ needs.classify.outputs.risk }}
          FAST: ${{ needs.fast.result }}
          HOST: ${{ needs.host.result }}
          IDF: ${{ needs.idf.result }}
        run: |
          [[ "$FAST" == success ]]
          [[ "$RISK" == R0 || "$HOST" == success ]]
          [[ "$EVENT_NAME" == pull_request && "$RISK" =~ ^R[01]$ || "$IDF" == success ]]
          if [[ "$RISK" == R3 ]]; then
            echo "Automated R3 gate passed; HIL/manual evidence remains required."
          fi
