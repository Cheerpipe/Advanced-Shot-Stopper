name: validation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      risk:
        description: Minimum risk gate
        type: choice
        options: [R0, R1, R2, R3]
        default: R3

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SHOTSTOPPER_VERBOSITY: compact
  SHOTSTOPPER_NONINTERACTIVE: "1"

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      risk: ${{ steps.risk.outputs.risk }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: risk
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REQUESTED_RISK: ${{ inputs.risk }}
        run: |
          mkdir -p ci-results/classify
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            risk=${REQUESTED_RISK:-R3}
            printf 'risk=%s\nsource=workflow input/default\n' "$risk" | tee ci-results/classify/classify.log
          else
            mapfile -t paths < <(git diff --name-only "$BASE_SHA" HEAD)
            output=$(./scripts/dev classify "${paths[@]}" 2>&1 | tee ci-results/classify/classify.log)
            risk=$(sed -n 's/^risk=//p' <<<"$output" | tail -1)
          fi
          [[ "$risk" =~ ^R[0-3]$ ]]
          echo "risk=$risk" >> "$GITHUB_OUTPUT"
      - name: Upload classification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-classify
          path: |
            ci-results/classify/
            artifacts/runs/
          if-no-files-found: error
          retention-days: 7

  fast:
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: ./scripts/setup-local-tools --check-pins
      - name: Fast validation
        shell: bash
        run: |
          mkdir -p ci-results/fast
          set -o pipefail
          ./scripts/dev validate --risk R0 README.md docs/README.md 2>&1 | tee ci-results/fast/fast.log
      - name: Upload fast validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-fast
          path: |
            ci-results/fast/
            artifacts/runs/
          if-no-files-found: error
          retention-days: 7

  host:
    needs: classify
    if: needs.classify.outputs.risk != 'R0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: mkdir -p ci-results/host
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"
          cache: npm
      - run: node --version && npm --version && test "$(node --version)" = v22.23.2 && test "$(npm --version)" = 10.9.8
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcjson-dev
      - run: npm ci --no-audit --no-fund
      - run: set -o pipefail; ./scripts/dev test normal 2>&1 | tee ci-results/host/normal.log
        shell: bash
      - run: set -o pipefail; ./scripts/dev test asan 2>&1 | tee ci-results/host/asan.log
        shell: bash
      - run: set -o pipefail; ./scripts/dev test tsan 2>&1 | tee ci-results/host/tsan.log
        shell: bash
      - run: set -o pipefail; ./scripts/dev test tooling 2>&1 | tee ci-results/host/tooling.log
        shell: bash
      - run: set -o pipefail; ./scripts/dev test web 2>&1 | tee ci-results/host/web.log
        shell: bash
      - run: python3 scripts/check_architecture.py
      - name: Upload host test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-host
          path: |
            ci-results/host/
            artifacts/runs/
          if-no-files-found: error
          retention-days: 7

  idf:
    needs: classify
    if: github.event_name != 'pull_request' || contains(fromJSON('["R2","R3"]'), needs.classify.outputs.risk)
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linea-micra, hardware: esp32-s3-relay-x1-speaker, machine: la-marzocco-linea-micra}
          - {name: silvia-pro-x, hardware: esp32-s3-relay-x1-speaker, machine: rancilio-silvia-pro-x}
          - {name: silvia-pro-x-reed, hardware: esp32-s3-relay-x1-speaker-reed, machine: rancilio-silvia-pro-x-reed}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: mkdir -p ci-results/idf && printf 'IDF_PATH=%s\n' "$IDF_PATH" > ci-results/idf/container.log
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.2"
          cache: npm
      - run: apt-get update && apt-get install -y --no-install-recommends cppcheck=2.13.0-2ubuntu3 && rm -rf /var/lib/apt/lists/*
      - name: Verify firmware tools
        shell: bash
        run: |
          source "$IDF_PATH/export.sh" >/dev/null
          node --version
          npm --version
          cppcheck --version
          idf.py --version
          test "$(node --version)" = v22.23.2
          test "$(npm --version)" = 10.9.8
          test "$(cppcheck --version)" = "Cppcheck 2.13.0"
          test "$(dpkg-query -W -f='${Version}' cppcheck)" = 2.13.0-2ubuntu3
          test "$(idf.py --version)" = "ESP-IDF v6.1"
      - run: npm ci --no-audit --no-fund
      - name: Build validation firmware
        shell: bash
        run: |
          set -o pipefail
          ./scripts/dev build --hardware ${{ matrix.hardware }} \
            --machine ${{ matrix.machine }} \
            --webui-language en \
            --o2 \
            --flags=-DSHOT_STOPPER_ENABLE_REMOTE_MACHINE_CONTROL=0 \
            --development \
            2>&1 | tee ci-results/idf/build-validation.log
      - name: Cppcheck
        if: needs.classify.outputs.risk == 'R3'
        shell: bash
        run: set -o pipefail; ./scripts/dev analyze --arch n16r8 --build-dir build-idf/${{ matrix.hardware }}--${{ matrix.machine }} 2>&1 | tee ci-results/idf/cppcheck.log
      - name: Full scheduled clang-tidy analysis
        if: needs.classify.outputs.risk == 'R3' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: set -o pipefail; ./scripts/static-tidy-idf --arch n16r8 --build-dir build-idf/${{ matrix.hardware }}--${{ matrix.machine }} 2>&1 | tee ci-results/idf/clang-tidy.log
      - name: Full scheduled IWYU analysis
        if: needs.classify.outputs.risk == 'R3' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: set -o pipefail; ./scripts/iwyu-idf --arch n16r8 --build-dir build-idf/${{ matrix.hardware }}--${{ matrix.machine }} 2>&1 | tee ci-results/idf/iwyu.log
      - name: Extra GCC warnings
        if: needs.classify.outputs.risk == 'R3'
        shell: bash
        run: set -o pipefail; ./scripts/warnings-idf --hardware ${{ matrix.hardware }} --machine ${{ matrix.machine }} --development 2>&1 | tee ci-results/idf/warnings.log
      - name: Full scheduled GCC analysis
        if: needs.classify.outputs.risk == 'R3' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: set -o pipefail; ./scripts/gcc_analyzer --hardware ${{ matrix.hardware }} --machine ${{ matrix.machine }} --flags= --development 2>&1 | tee ci-results/idf/gcc-analyzer.log
      - name: Build installable firmware
        shell: bash
        run: |
          set -o pipefail
          ./scripts/dev build --hardware ${{ matrix.hardware }} \
            --machine ${{ matrix.machine }} \
            --webui-language en \
            --o2 \
            --release \
            --flags "-DSHOT_STOPPER_ENABLE_JTAG=0 -DSHOT_STOPPER_ENABLE_REMOTE_MACHINE_CONTROL=0" \
            2>&1 | tee ci-results/idf/build-installable.log
      - name: Name OTA image
        run: >-
          cp build-idf/${{ matrix.hardware }}--${{ matrix.machine }}/shotstopper.bin
          build-idf/${{ matrix.hardware }}--${{ matrix.machine }}/shotstopper-ota-${{ matrix.name }}-jtag-off-remote-off.bin
      - name: Upload firmware and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shotstopper-ota-${{ matrix.name }}-jtag-off-remote-off
          path: |
            build-idf/${{ matrix.hardware }}--${{ matrix.machine }}/shotstopper-ota-${{ matrix.name }}-jtag-off-remote-off.bin
            ci-results/idf/
            reports/
            artifacts/runs/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

  gate:
    needs: [classify, fast, host, idf]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RISK: ${{ needs.classify.outputs.risk }}
          FAST: ${{ needs.fast.result }}
          HOST: ${{ needs.host.result }}
          IDF: ${{ needs.idf.result }}
        run: |
          [[ "$FAST" == success ]]
          [[ "$RISK" == R0 || "$HOST" == success ]]
          [[ "$EVENT_NAME" == pull_request && "$RISK" =~ ^R[01]$ || "$IDF" == success ]]
          if [[ "$RISK" == R3 ]]; then
            echo "Automated R3 gate passed; HIL/manual evidence remains required."
          fi
