name: Home Assistant integration

on:
  pull_request:
    paths:
      - "integrations/AdvancedShotStopper/**"
      - "src/tests/fixtures/**"
      - ".github/workflows/home-assistant-integration.yml"
  push:
    branches: [main]
    tags: ["ha-v*"]
    paths:
      - "integrations/AdvancedShotStopper/**"
      - "src/tests/fixtures/**"
      - ".github/workflows/home-assistant-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/AdvancedShotStopper
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca
      - run: uv sync --group test
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy
      - run: python -m json.tool hacs.json >/dev/null
      - run: python -m json.tool custom_components/advanced_shot_stopper/manifest.json >/dev/null
      - name: Stage the dedicated-repository root for validators
        working-directory: ${{ github.workspace }}
        run: cp -R integrations/AdvancedShotStopper/. .
      - uses: home-assistant/actions/hassfest@342664e951e2fd5f00bc990fc968342388252475
      - uses: hacs/action@885037da508419fd08c13515967aec868dfdee2d
        with:
          category: integration

  publish:
    if: startsWith(github.ref, 'refs/tags/ha-v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Publish integration root
        env:
          DESTINATION: ${{ vars.HA_INTEGRATION_REPOSITORY }}
          TOKEN: ${{ secrets.HA_PUBLISH_TOKEN }}
        run: |
          test -n "$DESTINATION"
          test -n "$TOKEN"
          split=$(git subtree split --prefix integrations/AdvancedShotStopper "$GITHUB_SHA")
          publish_dir=$(mktemp -d)
          git worktree add --detach "$publish_dir" "$split"
          cp LICENSE "$publish_dir/LICENSE"
          git -C "$publish_dir" add LICENSE
          git -C "$publish_dir" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "build(release): include repository license" -m "- publish the complete AGPL-3.0-or-later license with the dedicated integration root"
          printf '#!/bin/sh\nprintf "%%s\\n" "$TOKEN"\n' >"$RUNNER_TEMP/ha-askpass"
          chmod 700 "$RUNNER_TEMP/ha-askpass"
          GIT_ASKPASS="$RUNNER_TEMP/ha-askpass" GIT_TERMINAL_PROMPT=0 git -C "$publish_dir" push "https://x-access-token@github.com/${DESTINATION}.git" "HEAD:refs/heads/main"
